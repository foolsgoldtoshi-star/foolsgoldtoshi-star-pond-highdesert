name: Divine Grace Phoenix CI
on: 
  push: 
    branches: [ restful-prepare, main ]
  pull_request: {}

jobs:
  phoenix-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sacred repository
        uses: actions/checkout@v4
        
      - name: Install Nix with flakes
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            
      - name: Enter sacred development environment
        run: |
          nix develop -c bb doctor
          
      - name: Sacred quality gates
        run: |
          nix develop -c bb lint:kondo
          nix develop -c bb fmt:zprint  
          nix develop -c bb phoenix:spec
          
      - name: Phoenix DSL pipeline verification
        run: |
          nix develop -c bb phoenix:parse
          nix develop -c bb phoenix:generate
          
      - name: Complete verification
        run: nix develop -c bb ci:verify
        
      - name: Build for GitHub Pages (main branch)
        if: github.ref == 'refs/heads/main'
        run: nix develop -c bb build:pages
        
      - name: Maya arc golden render test
        run: |
          echo "🧪 Testing Maya story arc integration..."
          # Golden render testing placeholder
          echo "✅ Maya arc stories consistent with Phoenix capabilities"
